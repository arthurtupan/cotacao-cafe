name: Atualizar Cotações do Café

on:
  # Roda todo dia útil às 18h (horário de Brasília = 12h UTC)
  schedule:
    - cron: "0 21 * * 1-5"

  # Permite disparar manualmente pela interface do GitHub
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: pip install requests beautifulsoup4

      - name: Executar scraper
        run: python scraper.py

      - name: Commit e push do cotacoes.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add cotacoes.json
          git diff --staged --quiet || git commit -m "chore: atualiza cotacoes.json [$(date '+%d/%m/%Y %H:%M')]"
          git push
